version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_app
    user: "1001:1001" # <--- Berjalan atas nama muzz biar gak bentrok permission
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=192.168.1.24 
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY} 
      - N8N_USER_FOLDER=/data
      - WEBHOOK_URL=${N8N_WEBHOOK_URL} 
    volumes:
     - ../../../app-storages/n8n:/data 
    restart: always
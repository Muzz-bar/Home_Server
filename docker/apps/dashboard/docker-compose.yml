services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage_app
    env_file:
      - .env
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Asia/Jakarta
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS},localhost:3005
    ports:
      - 3005:3000
    volumes:
      - ../../../app-storages/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
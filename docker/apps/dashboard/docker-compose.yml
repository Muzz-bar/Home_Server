services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage_app
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    ports:
      - 3005:3000
    volumes:
      - ../../../app-storages/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped